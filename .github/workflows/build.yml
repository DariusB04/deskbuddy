# Verifică la fiecare push / PR că aplicația de Windows se compilează.
# Release-urile (aplicația + firmware-ul) se publică automat, nu din workflow-ul ăsta.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build pc/windows/DeskBuddy -c Release
